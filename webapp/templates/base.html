<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}전국 세무서 조직과 기능 바로가기{% endblock %}</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700&family=Noto+Sans+KR:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<header class="site-header">
    <div class="container site-header-row">
        <a href="{{ url_for('main.index') }}" class="site-brand">
            <img src="{{ url_for('static', filename='img/nts_logo.png') }}" alt="국세청" class="site-brand-logo">
            <span class="site-brand-divider"></span>
            <span class="site-brand-text">
                <strong>전국 세무서</strong>
                <small>조직과 기능 바로가기</small>
            </span>
        </a>
        <span class="for-etners-badge">
            <span class="for-etners-label">for</span>
            <img src="{{ url_for('static', filename='img/etners_logo.png') }}" alt="etners" class="for-etners-logo">
        </span>
    </div>
</header>
<div class="container py-5">
    {% block content %}{% endblock %}
</div>
<footer class="site-footer">
    <div class="container site-footer-row">
        <img src="{{ url_for('static', filename='img/eton_mascot.png') }}" alt="이튼이" class="footer-mascot">
        <span>
            세무서 정보는 국세청 공식 자료를 기준으로 하며, 조직 개편에 따라 변경될 수 있습니다.<br>
            <span class="footer-made-for">Made for <img src="{{ url_for('static', filename='img/etners_logo.png') }}" alt="etners" class="footer-etners-logo"> employees</span>
        </span>
    </div>
</footer>
</body>
</html>
